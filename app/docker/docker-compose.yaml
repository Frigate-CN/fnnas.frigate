services:
  # 请尽量不要直接修改Compose文件
  frigate:
    container_name: frigate
    extends:
      file: extends${wizard_version}${wizard_network_suffix}.yaml
      service: frigate
    privileged: true
    restart: unless-stopped
    stop_grace_period: 60s
    image: docker.cnb.cool/frigate-cn/frigate:__FRIGATE_VERSION__${wizard_version}
    shm_size: ${wizard_shm_size}
    devices:
      - /dev/dri/:/dev/dri/${wizard_coral}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${TRIM_PKGETC}:/config
      - ${TRIM_PKGHOME}/video:/media/frigate
      - ${TRIM_APPDEST}/docker/frigate-nginx-${wizard_auth}.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ${TRIM_APPDEST}:/var/run/fn-app
      - ${TRIM_APPDEST}/docker/listen-internal.conf:/usr/local/nginx/conf/listen-internal.conf:ro
      - ${TRIM_APPDEST}/docker/native-port.conf:/usr/local/nginx/conf/native-port.conf:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      TZ: "Asia/Shanghai"
      HF_ENDPOINT: $wizard_endpoint
      GITHUB_ENDPOINT: $wizard_github_endpoint
